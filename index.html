<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orb Snake</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03080c;font-family:Arial;color:white}canvas{display:block;width:100%;height:100%}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,10,.86);z-index:5}.panel{width:320px;padding:32px;border-radius:24px;text-align:center;background:#091a21;border:1px solid #63efd655;box-shadow:0 12px 50px #000}.panel h1{color:#63efd6}.panel input,.panel button{width:100%;padding:13px;border-radius:10px;box-sizing:border-box}.panel input{margin-bottom:14px;background:#040d12;color:white;border:1px solid #63efd655}.panel button{border:0;background:linear-gradient(135deg,#63efd6,#3bb29b);font-weight:bold;cursor:pointer}.hud,.board{position:fixed;top:15px;padding:14px 18px;background:#05121acc;border:1px solid #63efd633;border-radius:15px;z-index:2}.hud{left:15px}.board{right:15px;width:180px}.board h3{margin:0 0 8px;color:#63efd6;font-size:13px}.board ol{margin:0;padding-left:20px}.over{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#02060add;z-index:6}</style></head><body><canvas id="game"></canvas><div class="hud">Score: <b id="score">0</b> | Length: <b id="len">15</b></div><div class="board"><h3>TOP SNAKES</h3><ol id="list"></ol></div><div id="menu"><div class="panel"><h1>ORB SNAKE</h1><input id="name" value="Player" maxlength="12"><button onclick="start()">PLAY GAME</button></div></div><div id="over" class="over"><div class="panel"><h1>GAME OVER</h1><p>Score: <b id="final">0</b></p><button onclick="restart()">PLAY AGAIN</button></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,run=false,score=0,orbs=[],snakes=[],last=0;const SIZE=2500,names=['Viper','Slinky','Shadow','NeonFang','Phantom','Apex','Zenith','Orbit','Kobra','Blitz'];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let mouse={x:0,y:0};addEventListener('mousemove',e=>mouse={x:e.clientX,y:e.clientY});function r(a,b){return Math.random()*(b-a)+a}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function orb(x,y,v=1){return{x:x??r(-SIZE,SIZE),y:y??r(-SIZE,SIZE),rad:v>1?r(6,10):r(3,5),v}}let p;function makePlayer(){p={x:0,y:0,a:0,sp:160,boost:285,speed:160,len:15,body:[],name:document.getElementById('name').value||'Player'};for(let i=0;i<p.len;i++)p.body.push({x:0,y:0})}function makeSnake(){let s={x:r(-SIZE,SIZE),y:r(-SIZE,SIZE),a:r(-3.14,3.14),ta:0,sp:r(120,150),len:Math.floor(r(20,65)),body:[],name:names[Math.floor(r(0,names.length))]};s.ta=s.a;for(let i=0;i<s.len;i++)s.body.push({x:s.x,y:s.y});return s}function restart(){score=0;makePlayer();orbs=[];for(let i=0;i<500;i++)orbs.push(orb());snakes=[];for(let i=0;i<10;i++)snakes.push(makeSnake());document.getElementById('over').style.display='none';run=true}function start(){document.getElementById('menu').style.display='none';restart()}function body(e){e.body[0]={x:e.x,y:e.y};for(let i=1;i<e.body.length;i++){let q=e.body[i-1],z=e.body[i],dx=q.x-z.x,dy=q.y-z.y,dd=Math.hypot(dx,dy);if(dd>8){z.x+=dx/dd*(dd-8);z.y+=dy/dd*(dd-8)}}while(e.body.length<Math.floor(e.len))e.body.push({...e.body.at(-1)});while(e.body.length>Math.floor(e.len))e.body.pop()}function updatePlayer(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let ta=dx||dy?Math.atan2(dy,dx):Math.atan2(mouse.y-H/2,mouse.x-W/2);let diff=((ta-p.a+Math.PI*3)%(Math.PI*2))-Math.PI;p.a+=diff*Math.min(dt*10,1);let boost=keys.shift||keys[' '];p.speed=boost&&p.len>10?p.boost:p.sp;if(boost&&p.len>10)p.len-=dt*2;p.x+=Math.cos(p.a)*p.speed*dt;p.y+=Math.sin(p.a)*p.speed*dt;p.x=Math.max(-SIZE,Math.min(SIZE,p.x));p.y=Math.max(-SIZE,Math.min(SIZE,p.y));body(p)}function updateSnake(s,dt){let near=d(s,p);if(near<500&&p.len<s.len){s.ta=Math.atan2(p.y-s.y,p.x-s.x)}else if(near<220&&p.len>=s.len){s.ta=Math.atan2(s.y-p.y,s.x-p.x)}else{let best=null,bd=360;for(let o of orbs){let q=d(s,o);if(q<bd){bd=q;best=o}}if(best)s.ta=Math.atan2(best.y-s.y,best.x-s.x);else s.ta+=r(-.7,.7)*dt}let diff=((s.ta-s.a+Math.PI*3)%(Math.PI*2))-Math.PI;s.a+=diff*Math.min(dt*5,1);s.x+=Math.cos(s.a)*s.sp*dt;s.y+=Math.sin(s.a)*s.sp*dt;s.x=Math.max(-SIZE,Math.min(SIZE,s.x));s.y=Math.max(-SIZE,Math.min(SIZE,s.y));body(s)}function eat(){for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];if(d(p,o)<p.len?18:18){p.len+=.4*o.v;score+=10*o.v;orbs.splice(i,1);orbs.push(orb())}}for(let s of snakes)for(let i=orbs.length-1;i>=0;i--)if(d(s,orbs[i])<15){s.len+=.3;orbs.splice(i,1);orbs.push(orb())}}function die(){run=false;for(let q of p.body)if(Math.random()<.5)orbs.push(orb(q.x,q.y,2));document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').style.display='flex'}function collide(){for(let s of snakes){for(let i=3;i<s.body.length;i++)if(d(p,s.body[i])<14)return die();for(let i=3;i<p.body.length;i++)if(d(s,p.body[i])<13){s.len=20;score+=50;break}}}function draw(){x.fillStyle='#03080c';x.fillRect(0,0,W,H);let size=65;x.strokeStyle='#63efd60b';x.lineWidth=1;x.beginPath();for(let gx=Math.floor((p.x-W/2)/size)*size;gx<p.x+W;gx+=size){let sx=gx-p.x+W/2;x.moveTo(sx,0);x.lineTo(sx,H)}for(let gy=Math.floor((p.y-H/2)/size)*size;gy<p.y+H;gy+=size){let sy=gy-p.y+H/2;x.moveTo(0,sy);x.lineTo(W,sy)}x.stroke();for(let o of orbs){let sx=o.x-p.x+W/2,sy=o.y-p.y+H/2;if(sx<-15||sy<-15||sx>W+15||sy>H+15)continue;x.fillStyle=o.v>1?'#ffe35b':'#63efd6';x.shadowBlur=10;x.shadowColor=x.fillStyle;x.beginPath();x.arc(sx,sy,o.rad,0,7);x.fill()}x.shadowBlur=0;for(let s of [...snakes,p]){for(let i=s.body.length-1;i>=0;i--){let q=s.body[i],sx=q.x-p.x+W/2,sy=q.y-p.y+H/2;x.fillStyle=s===p?'#63efd6':'#ff5b68';x.globalAlpha=.55+i/s.body.length*.45;x.beginPath();x.arc(sx,sy,7+(i/s.body.length)*4,0,7);x.fill()}x.globalAlpha=1;let sx=s.x-p.x+W/2,sy=s.y-p.y+H/2;x.fillStyle=s===p?'#8affea':'#ff6875';x.beginPath();x.arc(sx,sy,11,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(sx+Math.cos(s.a-.5)*6,sy+Math.sin(s.a-.5)*6,2.5,0,7);x.arc(sx+Math.cos(s.a+.5)*6,sy+Math.sin(s.a+.5)*6,2.5,0,7);x.fill()}document.getElementById('score').textContent=Math.floor(score);document.getElementById('len').textContent=Math.floor(p.len);let arr=[p,...snakes].sort((a,b)=>b.len-a.len);document.getElementById('list').innerHTML=arr.slice(0,5).map(s=>`<li>${s.name}: ${Math.floor(s.len)}</li>`).join('')}function loop(t){let dt=Math.min((t-last)/1000,.1);last=t;if(run){updatePlayer(dt);snakes.forEach(s=>updateSnake(s,dt));eat();collide()}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
